services:
  - type: web
    name: nexo-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexo-db
          property: connectionString

  - type: web
    name: nexo-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    plan: static
    buildArgs:
      - name: EXPO_PUBLIC_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: nexo-db
    plan: free
    databaseName: nexo
    user: nexo
